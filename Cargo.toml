[package]
name = "back_tester"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/server.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
derive_builder = "0.20.2"
nalgebra = "0.35.0"
rusqlite = "0.40.1"
stochastic-rs = "2.5.0"
strum = "0.28.0"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde","v4"] }
serde_json = "1.0.150"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
hyper = "1.10.1"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
statrs = "0.18.0"
strum_macros = "0.28.0"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
tokio-stream = "0.1.18"
io = "0.0.2"
bytes = "1.12.1"
rand = "0.10"
rand_distr = "0.6.0"
tokio-rustls = "0.26.5"
webpki-roots = "1.0.9"

[build-dependencies]
tonic-prost-build = "0.14.6"
